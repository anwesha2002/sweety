# Render Blueprint: one free Docker web service that runs the whole app (API + React app).
# See docs/deployment.md for the step-by-step guide, including what the free plan can and
# cannot do (it sleeps after 15 minutes without traffic, and Render's free Postgres expires
# after 30 days, so the database is an external one such as Neon).
services:
  - type: web
    name: sweety
    runtime: docker
    plan: free
    # Singapore is closest to Neon's ap-southeast-1 and to India. Pick the region nearest your
    # database (cannot be changed after the service is created).
    region: singapore
    dockerfilePath: ./Dockerfile
    # Render waits for this to answer 200 before it sends traffic to a new deploy.
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Your PostgreSQL connection string (for example from Neon). Render asks for it when the
      # Blueprint is created; it is never stored in this file.
      - key: DATABASE_URL
        sync: false
      # A random secret generated by Render the first time.
      - key: JWT_SECRET
        generateValue: true
      # Render's load balancer is one proxy in front of the app. If rate limiting seems to treat
      # all visitors as one address, see "Check the client IP setting" in docs/deployment.md.
      - key: TRUST_PROXY
        value: '1'
      - key: BCRYPT_ROUNDS
        value: '12'
