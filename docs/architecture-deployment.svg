<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Sweety deployment architecture</title>
  <desc id="d">The browser loads the React app from Vercel. API calls go through a Vercel rewrite to the Express API on Render, which queries PostgreSQL on Neon.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1278" height="578" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="40" y="54" font-size="24" font-weight="700" fill="#0f172a">Sweety · Deployment architecture</text>
  <text x="40" y="79" font-size="14" fill="#64748b">React on Vercel, Express API on Render, PostgreSQL on Neon. The browser only ever talks to one origin.</text>

  <!-- ===== Browser ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="190" width="170" height="200" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  </g>
  <rect x="75" y="214" width="100" height="70" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <rect x="75" y="214" width="100" height="16" rx="8" fill="#10b981"/>
  <rect x="75" y="222" width="100" height="8" fill="#10b981"/>
  <circle cx="86" cy="222" r="2.5" fill="#ffffff"/><circle cx="95" cy="222" r="2.5" fill="#ffffff"/><circle cx="104" cy="222" r="2.5" fill="#ffffff"/>
  <rect x="85" y="242" width="50" height="6" rx="3" fill="#a7f3d0"/>
  <rect x="85" y="256" width="80" height="6" rx="3" fill="#d1fae5"/>
  <rect x="85" y="270" width="36" height="6" rx="3" fill="#d1fae5"/>
  <text x="125" y="316" font-size="16" font-weight="700" fill="#064e3b" text-anchor="middle">User's browser</text>
  <text x="125" y="338" font-size="12" fill="#047857" text-anchor="middle">Runs the React app</text>
  <text x="125" y="356" font-size="12" fill="#047857" text-anchor="middle">Holds the HttpOnly</text>
  <text x="125" y="372" font-size="12" fill="#047857" text-anchor="middle">session cookie</text>

  <!-- ===== Vercel ===== -->
  <g filter="url(#shadow)">
    <rect x="280" y="100" width="270" height="370" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <circle cx="304" cy="130" r="6" fill="#0f172a"/>
  <text x="318" y="135" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0f172a">VERCEL</text>
  <text x="300" y="154" font-size="12" fill="#64748b">Frontend hosting</text>

  <rect x="300" y="170" width="230" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="318" y="200" font-size="15" font-weight="700" fill="#0f172a">React 19 app</text>
  <text x="318" y="222" font-size="12" fill="#475569">Vite static build, Tailwind CSS</text>
  <text x="318" y="240" font-size="12" fill="#475569">Router, forms, reports, chart</text>
  <text x="318" y="262" font-size="11" fill="#94a3b8">Served from Vercel's CDN</text>

  <rect x="300" y="300" width="230" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="318" y="330" font-size="15" font-weight="700" fill="#0f172a">Rewrite rule</text>
  <text x="318" y="352" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#475569">/api/*  →  Render</text>
  <text x="318" y="372" font-size="12" fill="#475569">Keeps browser and API on</text>
  <text x="318" y="388" font-size="12" fill="#475569">one origin (no CORS, no CSRF)</text>

  <!-- ===== Render ===== -->
  <g filter="url(#shadow)">
    <rect x="620" y="100" width="300" height="370" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <circle cx="644" cy="130" r="6" fill="#6366f1"/>
  <text x="658" y="135" font-size="14" font-weight="700" letter-spacing="1.5" fill="#4338ca">RENDER</text>
  <text x="640" y="154" font-size="12" fill="#64748b">Backend hosting, Docker container</text>

  <rect x="640" y="170" width="260" height="240" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="658" y="198" font-size="15" font-weight="700" fill="#0f172a">Express 5 API</text>
  <text x="658" y="216" font-size="11" fill="#94a3b8">Node 22 · TypeScript · /api/v1</text>
  <g font-size="12" fill="#3730a3">
    <rect x="658" y="230" width="224" height="30" rx="8" fill="#eef2ff"/>
    <text x="670" y="249">Helmet · CORS · rate limiting</text>
    <rect x="658" y="268" width="224" height="30" rx="8" fill="#eef2ff"/>
    <text x="670" y="287">Zod validation</text>
    <rect x="658" y="306" width="224" height="30" rx="8" fill="#eef2ff"/>
    <text x="670" y="325">JWT auth (HttpOnly cookie)</text>
    <rect x="658" y="344" width="224" height="52" rx="8" fill="#eef2ff"/>
    <text x="670" y="363">Controllers → Services →</text>
    <text x="670" y="381">Repositories (per feature)</text>
  </g>

  <rect x="640" y="424" width="260" height="30" rx="15" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="770" y="443" font-size="11.5" font-weight="600" fill="#92400e" text-anchor="middle">Free plan: sleeps when idle, ~30 s cold start</text>

  <!-- ===== Neon ===== -->
  <g filter="url(#shadow)">
    <rect x="990" y="100" width="250" height="370" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <circle cx="1014" cy="130" r="6" fill="#10b981"/>
  <text x="1028" y="135" font-size="14" font-weight="700" letter-spacing="1.5" fill="#047857">NEON</text>
  <text x="1010" y="154" font-size="12" fill="#64748b">Managed PostgreSQL</text>

  <rect x="1010" y="170" width="210" height="240" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <!-- database cylinder -->
  <path d="M1086 196 v34 a19 7 0 0 0 38 0 v-34" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <ellipse cx="1105" cy="196" rx="19" ry="7" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
  <path d="M1086 213 a19 7 0 0 0 38 0" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="1115" y="268" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">PostgreSQL</text>
  <g font-size="12" fill="#475569">
    <text x="1028" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">users</text>
    <text x="1028" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">glucose_readings</text>
    <text x="1028" y="346">One reading per slot per day</text>
    <text x="1028" y="364">CHECK value 40 to 600</text>
    <text x="1028" y="392" font-size="11" fill="#94a3b8">Migrations run on API start</text>
  </g>

  <!-- ===== Arrows ===== -->
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M212 225 H298"/>
    <path d="M212 355 H298"/>
    <path d="M532 355 H638"/>
    <path d="M902 355 H1008"/>
  </g>
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="255" cy="225" r="14" fill="#10b981"/><text x="255" y="230">1</text>
    <circle cx="255" cy="355" r="14" fill="#10b981"/><text x="255" y="360">2</text>
    <circle cx="585" cy="355" r="14" fill="#10b981"/><text x="585" y="360">3</text>
    <circle cx="955" cy="355" r="14" fill="#10b981"/><text x="955" y="360">4</text>
  </g>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="494" x2="1240" y2="494" stroke="#e2e8f0" stroke-width="1.5"/>
  <g font-size="13" fill="#334155">
    <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
      <circle cx="52" cy="520" r="11" fill="#10b981"/><text x="52" y="524">1</text>
      <circle cx="672" cy="520" r="11" fill="#10b981"/><text x="672" y="524">3</text>
      <circle cx="52" cy="550" r="11" fill="#10b981"/><text x="52" y="554">2</text>
      <circle cx="672" cy="550" r="11" fill="#10b981"/><text x="672" y="554">4</text>
    </g>
    <text x="72" y="525">The browser loads the React app (HTML, JS, CSS) from Vercel</text>
    <text x="692" y="525">Vercel rewrites /api/* to the Render API over HTTPS</text>
    <text x="72" y="555">The browser calls /api/v1/*; the session cookie goes with it</text>
    <text x="692" y="555">The API queries PostgreSQL through Drizzle ORM</text>
  </g>
</svg>
