# Serves the built React app and forwards /api to the Express container ("server").
# The browser only ever talks to this one origin, so the HttpOnly auth cookie works without CORS.

# If a TLS-terminating proxy (a platform load balancer, Caddy, ...) sits in front of this
# container, keep its X-Forwarded-Proto; otherwise use the scheme nginx saw.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # The API. Request bodies are small JSON, so keep the limit tight (the API enforces 100kb too).
  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    client_max_body_size 200k;
  }

  # Built files have content hashes in their names, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Everything else is the single-page app: unknown paths (like /readings) get index.html,
  # which must never be cached so a new deployment is picked up at once.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
